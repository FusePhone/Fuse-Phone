<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gama Interior Painting - Hero Banner</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body { font-family: -apple-system, system-ui, sans-serif; background: #f5f5f5; padding: 40px 20px; }
      h2 { text-align: center; margin-bottom: 12px; font-size: 1.3em; color: #333; }
      .label { text-align: center; color: #888; font-size: 0.85em; margin-bottom: 20px; }
      .img-wrap { max-width: 1200px; margin: 0 auto 60px; }
      .img-wrap img { width: 100%; border-radius: 12px; box-shadow: 0 8px 40px rgba(0,0,0,0.15); display: block; }
      .divider { height: 1px; background: #ddd; max-width: 400px; margin: 60px auto; }
      .note { text-align: center; color: #999; font-size: 0.82em; margin-top: 40px; }
    </style>
</head>
<body>

<h2>Version 1: With Background</h2>
<p class="label">Logo + you side by side, tight dark background, no phone number</p>
<div class="img-wrap">
    <img src="/hero-banner-with-bg.png" alt="Gama Interior Painting Hero Banner">
</div>

<div class="divider"></div>

<h2>Version 2: No Background</h2>
<p class="label">Logo + you side by side floating directly over the photos</p>
<div class="img-wrap">
    <img src="/hero-banner-no-bg.png" alt="Gama Interior Painting Hero Banner">
</div>

<p class="note">These are actual images (1200x276 PNG). Long-press or right-click to save.<br>They won't change when you rotate your phone.</p>

</body>
</html>
